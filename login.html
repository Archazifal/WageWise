<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WageWise — Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cyan: #00bdd4;
      --cyan-dark: #009ab0;
      --charcoal: #2c2e2a;
      --bg: #f0f2f5;
      --white: #ffffff;
      --border: #e2e8f0;
      --text: #1a202c;
      --muted: #718096;
      --danger: #e53e3e;
      --radius: 12px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .logo-row img { height: 36px; width: auto; }
    .logo-row span {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--charcoal);
      letter-spacing: -0.03em;
    }

    .card {
      width: 100%;
      background: var(--white);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px rgba(0,0,0,0.04), 0 10px 40px rgba(0,0,0,0.06);
      overflow: hidden;
    }

    /* Tabs */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1;
      padding: 16px;
      background: none;
      border: none;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .tab-btn.active {
      color: var(--cyan);
      border-bottom-color: var(--cyan);
    }

    .card-body { padding: 28px; }

    /* Form */
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      font-size: 0.825rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text);
      background: var(--white);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-group input:focus,
    .form-group select:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(0,189,212,0.12);
    }
    .form-group input::placeholder { color: #b0bec5; }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: var(--cyan);
      color: white;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s;
      margin-top: 4px;
    }
    .btn-primary:hover { background: var(--cyan-dark); transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .forgot-link {
      display: block;
      text-align: center;
      margin-top: 14px;
      font-size: 0.825rem;
      color: var(--muted);
      text-decoration: none;
    }
    .forgot-link:hover { color: var(--cyan); }

    /* Error / success */
    .alert {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 16px;
      display: none;
    }
    .alert.error { background: #fff5f5; border: 1px solid #fed7d7; color: var(--danger); display: block; }
    .alert.success { background: #f0fff4; border: 1px solid #c6f6d5; color: #276749; display: block; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .form-panel { display: none; }
    .form-panel.active { display: block; }

    /* Loading spinner */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer-note {
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>

<div class="login-wrapper">
  <a href="index.html" class="logo-row">
    <img src="wagewise_assets/Wagewise_logo.png" alt="WageWise" />
    <span>WageWise</span>
  </a>

  <div class="card">
    <div class="tabs">
      <button class="tab-btn active" data-tab="signin">Sign In</button>
      <button class="tab-btn" data-tab="signup">Create Account</button>
    </div>

    <div class="card-body">

      <!-- SIGN IN -->
      <div class="form-panel active" id="panel-signin">
        <div class="alert" id="signin-alert"></div>
        <div class="form-group">
          <label for="signin-email">Email</label>
          <input type="email" id="signin-email" placeholder="juandc@email.com" autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="signin-password">Password</label>
          <input type="password" id="signin-password" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <button class="btn-primary" id="btn-signin">Sign In</button>
        <a href="#" class="forgot-link" id="link-forgot">Forgot password?</a>
      </div>

      <!-- SIGN UP -->
      <div class="form-panel" id="panel-signup">
        <div class="alert" id="signup-alert"></div>
        <div class="form-group">
          <label for="signup-name">Full Name</label>
          <input type="text" id="signup-name" placeholder="Juan dela Cruz" autocomplete="name" />
        </div>
        <div class="form-group">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" placeholder="juan@email.com" autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" placeholder="Min. 6 characters" autocomplete="new-password" />
        </div>
        <button class="btn-primary" id="btn-signup">Create Account</button>
        <p style="font-size:0.78rem;color:#718096;text-align:center;margin-top:12px;">
          Your account will have employee access by default.<br>Admins are configured separately.
        </p>
      </div>

    </div>
  </div>

  <p class="footer-note">© 2026 WageWise. Secure cloud payroll.</p>
</div>

<script type="module">
  import { initializeApp }           from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js';
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged }
    from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js';
  import { getFirestore, doc, setDoc, getDoc, serverTimestamp }
    from 'https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js';
  import { firebaseConfig } from './firebase-config.js';

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  // ── Tab switching ──────────────────────────────────────────────────────────
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
      clearAlerts();
    });
  });

  function clearAlerts() {
    document.querySelectorAll('.alert').forEach(a => { a.className = 'alert'; a.textContent = ''; });
  }
  function showAlert(id, msg, type = 'error') {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.className = 'alert ' + type;
  }
  function setLoading(btn, loading) {
    btn.disabled = loading;
    btn.innerHTML = loading
      ? '<span class="spinner"></span>Please wait…'
      : btn.dataset.label;
  }

  // Store default labels
  document.getElementById('btn-signin').dataset.label = 'Sign In';
  document.getElementById('btn-signup').dataset.label = 'Create Account';

  // ── Redirect if already signed in (only if user doc is healthy) ───────────
  let autoRedirectDone = false;
  onAuthStateChanged(auth, async user => {
    if (!user || autoRedirectDone) return;
    try {
      const snap = await getDoc(doc(db, 'users', user.uid));
      if (snap.exists()) {
        autoRedirectDone = true;
        window.location.href = snap.data().role === 'admin' ? 'dashboard.html' : 'employee.html';
      }
      // If doc doesn't exist, stay on login page so user can sign in and we heal it
    } catch (e) { /* Firestore not ready yet — stay on login */ }
  });

  // ── Sign In ────────────────────────────────────────────────────────────────
  document.getElementById('btn-signin').addEventListener('click', async () => {
    const btn   = document.getElementById('btn-signin');
    const email = document.getElementById('signin-email').value.trim();
    const pass  = document.getElementById('signin-password').value;
    clearAlerts();
    if (!email || !pass) return showAlert('signin-alert', 'Please fill in all fields.');
    setLoading(btn, true);
    try {
      const cred = await signInWithEmailAndPassword(auth, email, pass);
      let snap = await getDoc(doc(db, 'users', cred.user.uid));

      // Self-heal: if Firestore doc is missing (e.g. failed during signup), create it now
      if (!snap.exists()) {
        await setDoc(doc(db, 'users', cred.user.uid), {
          name: email.split('@')[0],
          email: cred.user.email,
          role: 'employee',
          createdAt: serverTimestamp()
        });
        snap = await getDoc(doc(db, 'users', cred.user.uid));
      }

      autoRedirectDone = true;
      const role = snap.data().role;
      window.location.href = role === 'admin' ? 'dashboard.html' : 'employee.html';
    } catch (err) {
      setLoading(btn, false);
      showAlert('signin-alert', friendlyError(err.code));
    }
  });

  // ── Sign Up ────────────────────────────────────────────────────────────────
  document.getElementById('btn-signup').addEventListener('click', async () => {
    const btn   = document.getElementById('btn-signup');
    const name  = document.getElementById('signup-name').value.trim();
    const email = document.getElementById('signup-email').value.trim();
    const pass  = document.getElementById('signup-password').value;
    clearAlerts();
    if (!name || !email || !pass) return showAlert('signup-alert', 'Please fill in all fields.');
    if (pass.length < 6) return showAlert('signup-alert', 'Password must be at least 6 characters.');
    setLoading(btn, true);
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await setDoc(doc(db, 'users', cred.user.uid), {
        name, email, role: 'employee', createdAt: serverTimestamp()
      });
      window.location.href = 'employee.html';
    } catch (err) {
      setLoading(btn, false);
      showAlert('signup-alert', friendlyError(err.code));
    }
  });

  // ── Forgot Password ────────────────────────────────────────────────────────
  document.getElementById('link-forgot').addEventListener('click', async e => {
    e.preventDefault();
    const email = document.getElementById('signin-email').value.trim();
    if (!email) return showAlert('signin-alert', 'Enter your email above, then click Forgot password.');
    try {
      await sendPasswordResetEmail(auth, email);
      showAlert('signin-alert', 'Password reset email sent. Check your inbox.', 'success');
    } catch (err) {
      showAlert('signin-alert', friendlyError(err.code));
    }
  });

  // Enter key support
  ['signin-email','signin-password'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('btn-signin').click();
    });
  });
  ['signup-name','signup-email','signup-password'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('btn-signup').click();
    });
  });

  function friendlyError(code) {
    const map = {
      'auth/user-not-found':       'No account found with that email.',
      'auth/wrong-password':       'Incorrect password. Try again.',
      'auth/invalid-email':        'Please enter a valid email address.',
      'auth/email-already-in-use': 'An account with this email already exists.',
      'auth/weak-password':        'Password must be at least 6 characters.',
      'auth/invalid-credential':   'Invalid email or password.',
      'auth/too-many-requests':    'Too many attempts. Please try again later.',
      'auth/network-request-failed': 'Network error. Check your connection.',
    };
    return map[code] || 'Something went wrong. Please try again.';
  }
</script>
</body>
</html>
